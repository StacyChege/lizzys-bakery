name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force full rebuild (no Docker layer cache)"
        type: boolean
        default: false

env:
  BACKEND_IMAGE: ghcr.io/stacychege/lizzys-bakery-backend
  FRONTEND_IMAGE: ghcr.io/stacychege/lizzys-bakery-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./lizzys-bakery-backend
          file: ./lizzys-bakery-backend/Dockerfile
          push: true
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./lizzys-bakery-frontend
          file: ./lizzys-bakery-frontend/Dockerfile
          push: true
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Fires AFTER images are pushed — Dokploy always pulls the new digest.
      # Uses API key auth (more reliable than webhook URL, which changes
      # whenever the compose service is recreated in Dokploy).
      - name: Trigger Dokploy deploy
        continue-on-error: true
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_URL" ]; then
            echo "::warning::DOKPLOY_URL, DOKPLOY_API_KEY or DOKPLOY_COMPOSE_ID not set — deploy not triggered"
            exit 0
          fi
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          COMMIT_SHA="${{ github.sha }}"
          code=$(curl -skL -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\", \"title\": \"$COMMIT_MSG\", \"description\": \"$COMMIT_SHA\"}" \
            -o /dev/null -w "%{http_code}" --max-time 30 \
            "$DOKPLOY_URL/api/compose.redeploy") || code="000"
          echo "Redeploy response: HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy triggered successfully"
          else
            echo "::warning::Redeploy returned $code — check DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID"
          fi
