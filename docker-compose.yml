services:

  backend:
    image: ghcr.io/stacychege/lizzys-bakery-backend:latest
    pull_policy: always
    container_name: lizzys-bakery-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      # Compose only passes through variables named here — anything set in
      # Dokploy's env screen but not referenced below never reaches the
      # container, which is why email silently stayed on the console backend.
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-Lizzy's Bakery <noreply@lizzysbakery.com>}"
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    volumes:
      - media:/app/media
    expose:
      - "8000"

  frontend:
    image: ghcr.io/stacychege/lizzys-bakery-frontend:latest
    pull_policy: always
    container_name: lizzys-bakery-frontend
    restart: unless-stopped
    expose:
      - "80"

volumes:
  media:
