server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing — any path not matching a real
    # file (e.g. /menu, /product/some-cake) must fall back to index.html,
    # or refreshing on a sub-route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
